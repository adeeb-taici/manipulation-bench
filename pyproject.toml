[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manipulation-bench"
version = "0.1.0"
description = "Multi-agent evaluation framework for studying manipulation"
requires-python = ">=3.11"
dependencies = [
    # inspect-ai is pre-1.0; minor-version bumps have historically been
    # breaking, so we cap at <0.4 (current verified: 0.3.205).
    "inspect-ai>=0.3.80,<0.4",
    "pyyaml>=6.0,<7.0",
    "diplomacy>=1.1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    # ruff is pre-1.0; breaking changes can happen in minor releases.
    "ruff>=0.1,<1.0",
]

[project.entry-points.inspect_ai]
manipulation_bench = "manipulation_bench._registry"

[project.scripts]
mb = "manipulation_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
